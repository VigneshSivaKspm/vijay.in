<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF9F6" />
    <meta name="color-scheme" content="light" />

    <!-- Route-specific SEO (title, description, canonical, Open Graph, Twitter, JSON-LD) is injected
         here by vite-plugin-seo.ts from src/seo/site.ts, and kept in sync at runtime by useSeo(). -->
    <!--seo:head-->

    <meta name="author" content="S Vijay Krishnan" />
    <meta name="application-name" content="S Vijay Krishnan" />
    <meta name="apple-mobile-web-app-title" content="S Vijay Krishnan" />
    <meta name="keywords" content="S Vijay Krishnan, Vijay Krishnan, Youpeak Tech, Youpeak Tech CEO, film producer, Chennai" />
    <meta name="geo.region" content="IN-TN" />
    <meta name="geo.placename" content="Chennai" />

    <!-- Icons & manifest -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Global structured data: Person + Organization + WebSite (generated from src/seo/site.ts) -->
    <!--seo:global-->

    <!-- Fonts are self-hosted (public/fonts, @font-face in src/index.css). Preload only what the first screen needs. -->
    <link rel="preload" href="/fonts/BebasNeue-normal-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Manrope-normal-300-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/CormorantGaramond-italic-400.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!-- Semantic static content (crawlable without JavaScript) lives inside #root and is
         replaced by React on mount. -->
    <div id="root"><!--seo:body--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
